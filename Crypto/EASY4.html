<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Hex Viewer</title>
    <style>
        /* ── Reset & Base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0d0d1a;
            color: #d4d4d4;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .app-header {
            background: #16162e;
            padding: 14px 24px;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        .app-header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #f0f0ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-header h1 small {
            font-weight: 400;
            font-size: 13px;
            color: #8888aa;
            letter-spacing: 0;
        }
        .header-info {
            font-size: 13px;
            color: #8888aa;
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .header-info span {
            background: #1e1e3a;
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid #2a2a4a;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 12px;
        }

        /* ── Main Grid ── */
        .app-main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1.6fr 1fr;
            gap: 0;
            overflow: hidden;
            min-height: 0;
        }

        /* ── Panel base ── */
        .panel {
            display: flex;
            flex-direction: column;
            background: #111125;
            border-right: 1px solid #222244;
            overflow: hidden;
            min-width: 0;
        }
        .panel:last-child {
            border-right: none;
        }

        .panel-header {
            background: #16162e;
            padding: 8px 16px;
            border-bottom: 1px solid #222244;
            font-size: 13px;
            font-weight: 500;
            color: #a8a8d0;
            letter-spacing: 0.3px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel-header .badge {
            font-size: 11px;
            background: #1e1e3a;
            padding: 2px 10px;
            border-radius: 10px;
            color: #6666aa;
            font-weight: 400;
        }

        .panel-body {
            flex: 1;
            overflow: auto;
            padding: 0;
            position: relative;
        }

        /* ── Image Panel ── */
        #imagePanel .panel-body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a18;
            padding: 12px;
        }
        #imagePanel .panel-body img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
            image-rendering: auto;
            background: #0a0a18;
        }

        /* ── Hex Panel ── */
        #hexPanel .panel-body {
            background: #0d0d1f;
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 13px;
            line-height: 1.6;
            padding: 8px 0 16px 0;
            color: #c8c8e8;
            overflow: auto;
        }
        #hexPanel .panel-body pre {
            margin: 0;
            padding: 0 16px;
            white-space: pre;
            tab-size: 0;
            user-select: text;
            -webkit-user-select: text;
            cursor: text;
        }
        #hexPanel .panel-body pre .offset {
            color: #555577;
            user-select: none;
            -webkit-user-select: none;
            display: inline-block;
            width: 72px;
        }
        #hexPanel .panel-body pre .hex-byte {
            display: inline-block;
            width: 24px;
            text-align: center;
            color: #b8d8f0;
        }
        #hexPanel .panel-body pre .hex-byte.high {
            color: #f0b8a0;
        }
        #hexPanel .panel-body pre .ascii-char {
            color: #90c0a0;
        }
        #hexPanel .panel-body pre .ascii-char.nonprint {
            color: #444466;
        }
        #hexPanel .panel-body pre .gap {
            color: #222244;
            user-select: none;
            -webkit-user-select: none;
        }
        #hexPanel .panel-body pre .ellipsis {
            color: #666688;
            font-style: italic;
        }

        /* ── Strings Panel ── */
        #stringsPanel .panel-body {
            background: #0d0d1f;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.7;
            padding: 8px 0 16px 0;
            color: #c8c8e8;
            overflow: auto;
        }
        #stringsPanel .panel-body pre {
            margin: 0;
            padding: 0 16px;
            white-space: pre;
            user-select: text;
            -webkit-user-select: text;
            cursor: text;
        }
        #stringsPanel .panel-body pre .str-offset {
            color: #555577;
            user-select: none;
            -webkit-user-select: none;
            display: inline-block;
            width: 72px;
        }
        #stringsPanel .panel-body pre .str-value {
            color: #d4b8e8;
        }
        #stringsPanel .panel-body pre .str-value .print {
            color: #e8d48a;
        }
        #stringsPanel .panel-body pre .str-value .nonprint {
            color: #555577;
        }
        #stringsPanel .panel-body pre .str-empty {
            color: #444466;
            font-style: italic;
        }
        #stringsPanel .panel-body pre .ellipsis {
            color: #666688;
            font-style: italic;
        }

        /* ── Scrollbar styling ── */
        .panel-body::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .panel-body::-webkit-scrollbar-track {
            background: #16162e;
        }
        .panel-body::-webkit-scrollbar-thumb {
            background: #2a2a5a;
            border-radius: 3px;
        }
        .panel-body::-webkit-scrollbar-thumb:hover {
            background: #3a3a7a;
        }

        /* ── Responsive ── */
        @media (max-width: 1200px) {
            .app-main {
                grid-template-columns: 1fr 1.4fr 1fr;
            }
        }
        @media (max-width: 900px) {
            .app-main {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
            }
            #imagePanel {
                grid-row: 1;
                grid-column: 1 / 3;
                border-right: none;
                border-bottom: 1px solid #222244;
            }
            #hexPanel {
                grid-row: 2;
                grid-column: 1;
                border-right: 1px solid #222244;
            }
            #stringsPanel {
                grid-row: 2;
                grid-column: 2;
            }
        }
        @media (max-width: 600px) {
            .app-main {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1.4fr 1fr;
            }
            #imagePanel {
                grid-row: 1;
                grid-column: 1;
                border-right: none;
                border-bottom: 1px solid #222244;
            }
            #hexPanel {
                grid-row: 2;
                grid-column: 1;
                border-right: none;
                border-bottom: 1px solid #222244;
            }
            #stringsPanel {
                grid-row: 3;
                grid-column: 1;
            }
            .app-header h1 {
                font-size: 15px;
            }
            .header-info span {
                font-size: 11px;
                padding: 2px 8px;
            }
            #hexPanel .panel-body {
                font-size: 11px;
                line-height: 1.5;
            }
            #stringsPanel .panel-body {
                font-size: 11px;
                line-height: 1.5;
            }
        }
        @media (max-width: 400px) {
            .app-header {
                padding: 10px 14px;
            }
            .app-header h1 {
                font-size: 13px;
            }
            .header-info {
                font-size: 11px;
                gap: 8px;
                flex-wrap: wrap;
            }
            .panel-header {
                font-size: 11px;
                padding: 6px 12px;
            }
        }

        .select-text {
            user-select: text;
            -webkit-user-select: text;
        }
    </style>
</head>
<body>

    <!-- ─── HEADER ─── -->
    <header class="app-header">
        <h1>
            Image Hex Viewer
            <small>EB-707 Condor · Chilean Air Force · CONDOR-666c6167 NUMBER-7b31745f IANA-7734735f CODE-6a753574 FLIGHT-5f306e5f SIGNAL-7430707d</small>
        </h1>
        <div class="header-info">
            <span id="fileSize">—</span>
            <span id="byteCount">—</span>
            <span id="stringCount">—</span>
        </div>
    </header>

    <!-- ─── MAIN GRID ─── -->
    <div class="app-main">

        <!-- Image Panel -->
        <section class="panel" id="imagePanel">
            <div class="panel-header">
                <span>Image</span>
                <span class="badge">render</span>
            </div>
            <div class="panel-body">
                <img id="theImage" src="" alt="EB-707 Condor" />
            </div>
        </section>

        <!-- Hex Panel -->
        <section class="panel" id="hexPanel">
            <div class="panel-header">
                <span>Hex Dump</span>
                <span class="badge">offset · hex · ascii</span>
            </div>
            <div class="panel-body" id="hexContainer">
                <pre id="hexContent">Loading…</pre>
            </div>
        </section>

        <!-- Strings Panel -->
        <section class="panel" id="stringsPanel">
            <div class="panel-header">
                <span>Strings</span>
                <span class="badge">printable ASCII ≥ 4 chars</span>
            </div>
            <div class="panel-body" id="stringsContainer">
                <pre id="stringsContent">Loading…</pre>
            </div>
        </section>

    </div>

    <script>
        (() => {
            'use strict';

            // ─── Config ────────────────────────────────────────────────
            const IMAGE_URL =
                'https://upload.wikimedia.org/wikipedia/commons/3/35/EB-707_Condor%2C_Chilean_Air_Force_%28FACh%29_v2.jpg';

            const BYTES_PER_ROW = 16;
            const MIN_STRING_LEN = 4;
            const MAX_HEX_ROWS = 100;      // rows shown at start and end
            const MAX_STRINGS = 100;       // strings shown at start and end

            // ─── DOM refs ──────────────────────────────────────────────
            const imgEl = document.getElementById('theImage');
            const hexContent = document.getElementById('hexContent');
            const stringsContent = document.getElementById('stringsContent');
            const fileSizeEl = document.getElementById('fileSize');
            const byteCountEl = document.getElementById('byteCount');
            const stringCountEl = document.getElementById('stringCount');

            // ─── Helpers ──────────────────────────────────────────────
            function toHexByte(b) {
                return b.toString(16).padStart(2, '0').toUpperCase();
            }

            function isPrintableASCII(b) {
                return b >= 32 && b <= 126;
            }

            function escapeAsciiChar(b) {
                if (b === 0x0A) return '↵';
                if (b === 0x0D) return '⏎';
                if (b === 0x09) return '→';
                if (b === 0x00) return '·';
                if (b >= 32 && b <= 126) return String.fromCharCode(b);
                return '·';
            }

            // ─── Build hex dump with truncation ──────────────────────
            function buildHexDump(bytes) {
                const total = bytes.length;
                const rows = [];

                for (let offset = 0; offset < total; offset += BYTES_PER_ROW) {
                    const chunk = bytes.slice(offset, offset + BYTES_PER_ROW);
                    const hexParts = [];
                    const asciiParts = [];

                    for (let i = 0; i < BYTES_PER_ROW; i++) {
                        if (i < chunk.length) {
                            const b = chunk[i];
                            hexParts.push(toHexByte(b));
                            asciiParts.push(escapeAsciiChar(b));
                        } else {
                            hexParts.push('  ');
                            asciiParts.push(' ');
                        }
                    }

                    const hexStr = hexParts.join(' ');
                    const asciiStr = asciiParts.join('');

                    let line = '';
                    line += `<span class="offset">${offset.toString(16).padStart(8, '0').toUpperCase()}</span>`;
                    line += '  ';
                    for (let i = 0; i < hexParts.length; i++) {
                        const h = hexParts[i];
                        const cls = (i % 2 === 0) ? 'hex-byte' : 'hex-byte high';
                        line += `<span class="${cls}">${h}</span>`;
                        if (i < hexParts.length - 1 && (i + 1) % 4 === 0) {
                            line += `<span class="gap"> </span>`;
                        } else if (i < hexParts.length - 1) {
                            line += ' ';
                        }
                    }
                    const hexLen = hexParts.length * 3 + Math.floor((hexParts.length - 1) / 4);
                    const padLen = 49 - hexLen;
                    if (padLen > 0) {
                        line += ' '.repeat(padLen);
                    }
                    line += ' ';
                    for (let i = 0; i < asciiParts.length; i++) {
                        const ch = asciiParts[i];
                        const cls = (ch !== '·' && ch !== '↵' && ch !== '⏎' && ch !== '→') ? 'ascii-char' :
                            'ascii-char nonprint';
                        line += `<span class="${cls}">${ch}</span>`;
                    }

                    rows.push(line);
                }

                // Truncate to first and last MAX_HEX_ROWS
                if (rows.length > MAX_HEX_ROWS * 2) {
                    const first = rows.slice(0, MAX_HEX_ROWS);
                    const last = rows.slice(rows.length - MAX_HEX_ROWS);
                    const omitted = rows.length - MAX_HEX_ROWS * 2;
                    const ellipsis = `<span class="ellipsis">........  ... (${omitted} rows omitted) ...</span>`;
                    return first.concat(ellipsis, last).join('\n');
                }
                return rows.join('\n');
            }

            // ─── Extract strings ──────────────────────────────────────
            function extractStrings(bytes) {
                const results = [];
                let i = 0;
                const len = bytes.length;

                while (i < len) {
                    while (i < len && !isPrintableASCII(bytes[i])) i++;
                    if (i >= len) break;

                    const start = i;
                    let str = '';
                    while (i < len && isPrintableASCII(bytes[i])) {
                        str += String.fromCharCode(bytes[i]);
                        i++;
                    }
                    if (str.length >= MIN_STRING_LEN) {
                        results.push({ offset: start, value: str });
                    }
                }
                return results;
            }

            // ─── Render strings with truncation ──────────────────────
            function renderStrings(strings) {
                if (!strings || strings.length === 0) {
                    return '<span class="str-empty">(no strings found)</span>';
                }

                let display = strings;
                let omitted = 0;
                if (strings.length > MAX_STRINGS * 2) {
                    display = strings.slice(0, MAX_STRINGS).concat(strings.slice(strings.length - MAX_STRINGS));
                    omitted = strings.length - MAX_STRINGS * 2;
                }

                const lines = display.map((s, idx) => {
                    let escaped = '';
                    for (let i = 0; i < s.value.length; i++) {
                        const ch = s.value[i];
                        const code = ch.charCodeAt(0);
                        if (code >= 32 && code <= 126) {
                            escaped += `<span class="print">${ch}</span>`;
                        } else {
                            escaped += `<span class="nonprint">·</span>`;
                        }
                    }
                    const off = s.offset.toString(16).padStart(8, '0').toUpperCase();
                    return `<span class="str-offset">${off}</span>  <span class="str-value">${escaped}</span>`;
                });

                // Insert ellipsis after first group if omitted > 0
                if (omitted > 0) {
                    const ellipsis = `<span class="ellipsis">........  ... (${omitted} strings omitted) ...</span>`;
                    lines.splice(MAX_STRINGS, 0, ellipsis);
                }

                return lines.join('\n');
            }

            // ─── Main: fetch & render ────────────────────────────────
            async function loadImageAndParse() {
                try {
                    hexContent.textContent = 'Fetching image…';
                    stringsContent.textContent = 'Fetching image…';

                    const response = await fetch(IMAGE_URL);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const arrayBuffer = await response.arrayBuffer();
                    const bytes = new Uint8Array(arrayBuffer);
                    const totalBytes = bytes.length;

                    fileSizeEl.textContent = formatSize(totalBytes);
                    byteCountEl.textContent = `${totalBytes.toLocaleString()} bytes`;

                    // ── Display image ──
                    const blob = new Blob([arrayBuffer], { type: response.headers.get('content-type') || 'image/jpeg' });
                    const objectURL = URL.createObjectURL(blob);
                    imgEl.src = objectURL;
                    imgEl.alt = 'EB-707 Condor';

                    // ── Build hex dump ──
                    hexContent.innerHTML = buildHexDump(bytes);

                    // ── Extract & render strings ──
                    const strings = extractStrings(bytes);
                    stringCountEl.textContent = `${strings.length} strings`;
                    stringsContent.innerHTML = renderStrings(strings);

                    // ── Scroll to top ──
                    document.getElementById('hexContainer').scrollTop = 0;
                    document.getElementById('stringsContainer').scrollTop = 0;

                } catch (err) {
                    console.error(err);
                    hexContent.textContent = `Error: ${err.message}`;
                    stringsContent.textContent = `Error: ${err.message}`;
                    fileSizeEl.textContent = '—';
                    byteCountEl.textContent = '—';
                    stringCountEl.textContent = '—';
                }
            }

            // ─── Utils ──────────────────────────────────────────────────
            function formatSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
                return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
            }

            // ─── Go ────────────────────────────────────────────────────
            loadImageAndParse();

        })();
    </script>

</body>
</html>
