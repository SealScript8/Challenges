<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeuomorphic Cipher Wheel</title>
    <style>
        body {
            background-color: #2b2b2b;
            background-image: radial-gradient(rgba(0,0,0,0.4) 1px, transparent 0);
            background-size: 6px 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Arial Black", Gadget, sans-serif;
        }

        .main-layout {
            display: flex;
            flex-direction: row;
            gap: 60px;
            align-items: center;
        }

        .component-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .status-square {
            width: 95px;
            height: 70px;
            background: #111111;
            border: 4px solid #3d3d3d;
            border-bottom-color: #555555;
            border-right-color: #444444;
            border-radius: 8px;
            box-shadow: 
                inset 0px 4px 10px rgba(0,0,0,0.9), 
                0px 2px 4px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .status-square .label {
            font-size: 42px;
            font-weight: 900;
            color: #eeeeee; 
            text-shadow: 0px -1px 1px rgba(0,0,0,0.8), 0px 1px 0px rgba(255,255,255,0.2);
            letter-spacing: -1px;
            z-index: 2;
        }

        .box-shadow-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background: linear-gradient(to bottom, 
                rgba(0,0,0,0.7) 0%, 
                rgba(0,0,0,0.1) 25%,
                rgba(0,0,0,0) 50%,
                rgba(0,0,0,0.1) 75%,
                rgba(0,0,0,0.7) 100%
            );
        }

        .wheel-container {
            width: 95px;
            height: 190px;
            background: #111111;
            border: 4px solid #3d3d3d;
            border-bottom-color: #555555;
            border-right-color: #444444;
            border-radius: 10px;
            box-shadow: 
                inset 0px 4px 10px rgba(0,0,0,0.9), 
                0px 2px 5px rgba(0,0,0,0.5),
                0px 0px 0px 1px #222;
            overflow: hidden;
            position: relative;
        }

        .wheel-track {
            position: absolute;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(to right, #b5b5b5 0%, #eeeeee 15%, #ffffff 50%, #eeeeee 85%, #b5b5b5 100%);
            cursor: ns-resize;
            user-select: none;
            touch-action: none;
        }

        .digit {
            font-size: 42px;
            font-weight: 900;
            color: #222222; 
            height: 60px;
            line-height: 60px;
            text-align: center;
            width: 100%;
            text-shadow: 0px 1px 0px rgba(255,255,255,0.8);
            box-sizing: border-box;
            letter-spacing: -1px;
            background-image: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
        }

        .shadow-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(to bottom, 
                rgba(0,0,0,0.95) 0%, 
                rgba(0,0,0,0.7) 12%, 
                rgba(0,0,0,0.1) 32%,
                rgba(0,0,0,0) 45%,
                rgba(0,0,0,0) 55%,
                rgba(0,0,0,0.1) 68%, 
                rgba(0,0,0,0.7) 88%, 
                rgba(0,0,0,0.95) 100%
            );
        }

        .cipher-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 320px;
        }

        .io-box {
            background: #1a1a1a;
            border: 3px solid #3d3d3d;
            border-bottom-color: #555555;
            border-right-color: #444444;
            border-radius: 8px;
            box-shadow: 
                inset 0px 4px 10px rgba(0,0,0,0.9), 
                0px 2px 4px rgba(0,0,0,0.4);
            padding: 12px;
            color: #eeeeee;
            font-family: "Courier New", Courier, monospace;
            font-size: 16px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        .io-box::placeholder {
            color: #555555;
        }

        #messageInput {
            height: 120px;
        }

        #messageOutput {
            height: 120px;
            background: #111111;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <div class="component-stack">
            <div class="status-square">
                <div class="label">A</div>
                <div class="box-shadow-overlay"></div>
            </div>

            <div class="status-square">
                <div class="label" id="letterOutput">A</div>
                <div class="box-shadow-overlay"></div>
            </div>

            <div class="wheel-container">
                <div class="wheel-track" id="wheelTrack"></div>
                <div class="shadow-overlay"></div>
            </div>
        </div>

        <div class="cipher-panel">
            <textarea class="io-box" id="messageInput" placeholder="Type your message here..."></textarea>
            <textarea class="io-box" id="messageOutput" readonly placeholder="Encrypted output..."></textarea>
        </div>
    </div>

    <script>
        const track = document.getElementById('wheelTrack');
        const letterOutput = document.getElementById('letterOutput');
        const messageInput = document.getElementById('messageInput');
        const messageOutput = document.getElementById('messageOutput');
        const itemHeight = 60; 
        const itemsCount = 26;

        function populateTrack() {
            for (let set = 0; set < 3; set++) {
                for (let i = 1; i <= itemsCount; i++) {
                    const div = document.createElement('div');
                    div.className = 'digit';
                    div.textContent = i;
                    track.appendChild(div);
                }
            }
        }
        populateTrack();

        const baseOffset = itemHeight * itemsCount; 
        let currentY = -baseOffset + 65; 
        let currentShift = 0;

        function updateMappedLetter() {
            let rawIndex = Math.round((currentY - 65) / -itemHeight);
            let normalizedNumber = ((rawIndex % itemsCount) + itemsCount) % itemsCount + 1;
            let letter = String.fromCharCode(64 + normalizedNumber);
            letterOutput.textContent = letter;
            currentShift = normalizedNumber - 1;
            transformText();
        }

        function updatePosition() {
            track.style.transform = `translateY(${currentY}px)`;
            updateMappedLetter();
        }

        function rotTransform(text, shift) {
            return text.replace(/[a-zA-Z]/g, function(char) {
                const base = char <= 'Z' ? 65 : 97;
                return String.fromCharCode(((char.charCodeAt(0) - base + shift) % 26 + 26) % 26 + base);
            });
        }

        function transformText() {
            messageOutput.value = rotTransform(messageInput.value, currentShift);
        }

        updatePosition();

        let isDragging = false;
        let startY = 0;
        let initialY = 0;

        function getEventY(e) {
            return e.touches ? e.touches[0].clientY : e.clientY;
        }

        function dragStart(e) {
            isDragging = true;
            startY = getEventY(e);
            initialY = currentY;
            track.style.transition = 'none';
        }

        function dragMove(e) {
            if (!isDragging) return;
            const deltaY = getEventY(e) - startY;
            currentY = initialY + deltaY;

            const topBoundary = -60; 
            const bottomBoundary = -(baseOffset * 2) + 60;

            if (currentY > topBoundary) {
                currentY -= baseOffset; 
                startY = getEventY(e);
                initialY = currentY;
            } else if (currentY < bottomBoundary) {
                currentY += baseOffset; 
                startY = getEventY(e);
                initialY = currentY;
            }

            updatePosition();
        }

        function dragEnd() {
            if (!isDragging) return;
            isDragging = false;

            track.style.transition = 'transform 0.2s cubic-bezier(0.25, 1, 0.5, 1)';
            let indexOffset = Math.round((currentY - 65) / itemHeight);
            currentY = (indexOffset * itemHeight) + 65;

            updatePosition();
        }

        track.addEventListener('mousedown', dragStart);
        window.addEventListener('mousemove', dragMove);
        window.addEventListener('mouseup', dragEnd);

        track.addEventListener('touchstart', dragStart, { passive: true });
        window.addEventListener('touchmove', dragMove, { passive: true });
        window.addEventListener('touchend', dragEnd);

        window.addEventListener('wheel', (e) => {
            if (e.target.closest('.wheel-container')) {
                e.preventDefault();
                track.style.transition = 'transform 0.15s cubic-bezier(0.25, 1, 0.5, 1)';

                if (e.deltaY > 0) {
                    currentY -= itemHeight;
                } else {
                    currentY += itemHeight;
                }

                if (currentY > -60) currentY -= baseOffset;
                if (currentY < -(baseOffset * 2) + 60) currentY += baseOffset;

                updatePosition();
            }
        }, { passive: false });

        messageInput.addEventListener('input', transformText);
    </script>

</body>
</html>
